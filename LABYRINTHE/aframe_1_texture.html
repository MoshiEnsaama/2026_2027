<html>  
    <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/elbobo/aframe-multisrc-component/b6d23310/dist/0.3/aframe-multisrc-component.js"></script>
    </head>

    <body>

        <a-scene>
            <a-assets>
              <img id="texture" src="./assets\texture/bush_texture.jpg">
            </a-assets>

            <a-box position="0 1 -4" color="tomato" depth="1" height="1" width="1"></a-box>
            <a-box src="#texture" position="3 1 -4"></a-box>

            <a-plane position="0 0 -5" color="#CCC" height="5" width="5" material="side: double" src="#texture"></a-plane>

        </a-scene>
    </body>
</html>
